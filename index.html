<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Guitar Simulator</title>
  <meta name="theme-color" content="#F1E9DC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110E" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Guitar">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app preload" id="app">
    <main class="stage" id="stage">
      <div class="stage-probe" id="stage-probe" aria-hidden="true"></div>
      <div class="stage-inner">
        <svg id="guitar" class="guitar" viewBox="0 0 1240 480" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Classical guitar"></svg>
      </div>
      <div class="stage-foot">
        <p class="hint">Click, tap or drag across the strings to play.</p>
        <p class="credit"></p>
      </div>
    </main>
    <section id="dock" class="dock" aria-label="Tablature"></section>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
