<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Guitar Simulator</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app preload" id="app">
    <main class="stage">
      <div class="stage-inner">
        <svg id="guitar" class="guitar" viewBox="0 0 1240 480" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Classical guitar"></svg>
        <p class="hint">Click, tap or drag across the strings to play.</p>
        <p class="credit"></p>
      </div>
    </main>
    <section id="dock" class="dock" aria-label="Tablature"></section>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
